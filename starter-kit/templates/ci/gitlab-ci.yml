# CI for {{project.name}}
#
# Generated by the AI-SDLC starter kit. See docs/cicd/pipeline-notes.md for which stages gate the
# merge and which only report.
#
# Ordering principle: cheapest and most likely to fail goes first.

stages:
  - verify
  - scan
  - report

default:
  interruptible: true

# TODO(setup): pick the image this project builds and tests in.
# image: node:22-alpine

.verify_base:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

{{#if project.hasLintCommand}}
lint:
  extends: .verify_base
  # Before tests: faster, and it fails more often, so feedback arrives sooner.
  script:
    - |
      {{project.lintCommand}}
{{/if}}

# Block scalars, so a command containing a colon or a quote stays a command rather than becoming
# a YAML mapping.
test:
  extends: .verify_base
  script:
    - |
      {{project.testCommand}}

{{#if project.hasBuildCommand}}
build:
  extends: .verify_base
  script:
    - |
      {{project.buildCommand}}
{{/if}}

{{#if answers.secretScanInCi}}
secret-scan:
  stage: scan
  variables:
    GIT_DEPTH: 0 # secret scanning needs history
  script:
    # Any hit is treated as a leak and triggers rotation, not assessment.
    - |
      if git grep -nIE '(sk-[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-|AKIA[0-9A-Z]{16})' -- ':!*.md'; then
        echo "Potential secret committed. Rotate it, then remove it from history."
        exit 1
      fi
{{/if}}

{{#if answers.installRiskCheck}}
release-risk:
  stage: report
  # Not a gate. The score is an input to a human decision.
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - node tools/release-risk.mjs origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD
{{/if}}

{{#if answers.installDocDrift}}
doc-drift:
  stage: report
{{#unless answers.docDriftGatesCi}}
  allow_failure: true # advisory: reports findings without blocking
{{/unless}}
  script:
    - node tools/doc-drift.mjs
{{/if}}
