# CI for {{project.name}}
#
# Generated by the AI-SDLC starter kit. See docs/cicd/pipeline-notes.md for why it is shaped this
# way — in particular which stages gate the merge and which only report, because that distinction
# is the one that decides whether these checks survive contact with a deadline.
#
# Ordering principle: cheapest and most likely to fail goes first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Individual jobs widen this only where they must — a broad default
# token is the agent blast radius from docs/security/threat-model.md, pre-authorised.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

{{project.ciSetup}}

{{#if project.hasLintCommand}}
      # Lint before tests: it is faster and it fails more often, so it returns feedback sooner.
      - name: Lint
        run: |
          {{project.lintCommand}}

{{/if}}
{{#if project.hasTestCommand}}
      # Block scalars, so a command containing a colon or a quote stays a command rather than
      # becoming a YAML mapping.
      - name: Test
        run: |
          {{project.testCommand}}
{{/if}}
{{#unless project.hasTestCommand}}
      # No test command was named during setup, so there is nothing real to run here.
      #
      # This step fails deliberately rather than being omitted. A pipeline that reports green while
      # running no tests is exactly the "the number is lying to you" failure this kit warns about,
      # and it is worse than a red one because it manufactures confidence. Give it the real command
      # and re-run `--only=testing`, or delete this step as a deliberate, visible decision.
      - name: Test
        run: |
          echo "No test command is configured for this project."
          echo "Set project.testCommand in .sdlc-kit.json, then re-run:"
          echo "  node starter-kit/setup.mjs --only=testing"
          exit 1
{{/unless}}
{{#if project.hasBuildCommand}}

      - name: Build
        run: |
          {{project.buildCommand}}
{{/if}}

{{#if answers.secretScanInCi}}
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scanning needs history

      - name: Secret scan
        run: |
          # Any hit is treated as a leak and triggers rotation, not assessment. Reasoning about
          # whether a key was actually reachable costs more than rotating it, and being wrong
          # about reachability is unrecoverable.
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-|AKIA[0-9A-Z]{16})' -- ':!*.md'; then
            echo "::error::Potential secret committed. Rotate it, then remove it from history."
            exit 1
          fi

      - name: Guard agent instruction files
        # Context poisoning persists across every future agent run, which makes a change here a
        # security event rather than a documentation change. See docs/security/threat-model.md.
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -qE '^(AGENTS|CLAUDE)\.md$|^\.github/(copilot-instructions\.md|workflows/)|^\.cursor/'; then
            echo "::warning::This PR modifies agent instruction files or workflows. Security review required."
          fi

      # TODO(setup): this is where a real SAST run belongs — CodeQL, Semgrep, or your scanner of
      # choice. Left as a comment rather than a fake step, because a pipeline that pretends to
      # scan is worse than one that admits it does not.
      # - uses: github/codeql-action/analyze@v3
{{/if}}

{{#if answers.installRiskCheck}}
  release-risk:
    name: Release risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately not a merge gate. The score is an input to a human decision, and a gate on a
      # judgment call gets argued with, then bypassed, then removed.
      - name: Score the diff
        run: node tools/release-risk.mjs origin/${{ github.base_ref }}..HEAD | tee risk.txt

      - name: Comment the score on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '## Release risk\n\n```\n'
              + fs.readFileSync('risk.txt', 'utf8').replace(/\x1b\[[0-9;]*m/g, '')
              + '\n```';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
{{/if}}

{{#if answers.installDocDrift}}
  docs:
    name: Documentation drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for drift
        run: node tools/doc-drift.mjs
{{#unless answers.docDriftGatesCi}}
        continue-on-error: true # advisory: reports findings without blocking the merge
{{/unless}}
{{/if}}
